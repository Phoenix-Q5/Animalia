spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/animal
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=animal
spring.datasource.username=super
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=phnxdrone@gmail.com
spring.mail.password=*********
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.required=true

server.port=8080


management.endpoints.web.exposure.include=*
management.info.java.enabled=true
management.endpoint.metrics.enabled=true

management.info.git.enabled=true
management.info.git.mode=full

info.app.name=Animalia
info.app.description=Animalia Application built on Spring Boot 3
info.app.version=1.0.0

animalia.common.jooq.settings.returnRecordToPojo=false
animalia.common.jooq.settings.logStatistics=false