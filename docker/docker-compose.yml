services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    networks: [infra, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.animalia-api.rule=Host(`${API_HOST}`)"
      - "traefik.http.services.animalia-api.loadbalancer.server.port=8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-animal}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-super}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: https://${FRONTEND_HOST}
      REDIS_HOST: cache
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${KEYCLOAK_HOST}/realms/animalia
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/animalia/protocol/openid-connect/certs
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}

  frontend:
    build:
      context: ../animalia-fe/animalia
      args:
        REACT_APP_API_URL: https://${API_HOST}
        REACT_APP_KEYCLOAK_URL: https://${KEYCLOAK_HOST}
    restart: unless-stopped
    networks: [infra, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.animalia.rule=Host(`${FRONTEND_HOST}`)"
      - "traefik.http.services.animalia.loadbalancer.server.port=80"
    depends_on:
      - backend

networks:
  infra:
    external: true
  proxy:
    external: true
